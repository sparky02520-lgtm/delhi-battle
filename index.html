<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Delhi Battle | Cartoon Team Deathmatch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111421;color:white;font-family:system-ui,Arial,sans-serif;overflow:hidden}
button{border:0;border-radius:12px;padding:12px 17px;font-weight:800;background:#ff9849;color:#171421;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at top,#55517b,#151725 75%)}
.panel{width:min(470px,100%);padding:25px;border-radius:24px;background:#202437;border:1px solid #535872;text-align:center;box-shadow:0 20px 80px #0008}
.logo{font-size:clamp(36px,8vw,60px);font-weight:1000;letter-spacing:-3px;color:#ffb45b;text-shadow:3px 4px #893e30}
.small{color:#b9c3df;font-size:13px;line-height:1.5}
.row{display:flex;gap:9px;margin:12px 0}
.row button{flex:1;background:#383d56;color:#fff;border:2px solid transparent}
.row button.active{border-color:#ffb45b;background:#50465c}
#start{width:100%;font-size:19px;margin-top:12px}
#game{width:100vw;height:100dvh;display:block;touch-action:none}
#hud{display:none;position:fixed;z-index:3;top:0;left:0;right:0;padding:9px;pointer-events:none}
.hudrow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.badge{padding:8px 11px;border:1px solid #59617a;background:#171b2ae8;border-radius:11px;font-size:12px;font-weight:800}
#healthOuter{width:130px;height:9px;background:#63333e;border-radius:6px;overflow:hidden;margin-top:5px}
#health{height:100%;width:100%;background:#53e18b}
#message{position:fixed;z-index:5;top:28%;left:0;right:0;text-align:center;font-size:clamp(28px,7vw,52px);font-weight:1000;text-shadow:0 4px 12px #000;pointer-events:none}
#controls{display:none;position:fixed;z-index:4;inset:0;pointer-events:none}
.pad{position:absolute;width:58px;height:58px;border-radius:50%;padding:0;background:#ffffff26;color:white;border:2px solid #ffffff80;font-size:22px;pointer-events:auto;user-select:none;-webkit-user-select:none}
#left{bottom:20px;left:16px}#right{bottom:20px;left:84px}
#jump{bottom:90px;right:18px}#fire{bottom:20px;right:18px;background:#ed564a99}
#melee{bottom:20px;right:88px}#reload{bottom:90px;right:88px}
@media(min-width:800px){#controls{display:none!important}}
@media(max-width:799px){.badge{font-size:10px;padding:7px}.panel{padding:19px}}
</style>
</head>
<body>
<div id="menu">
 <div class="panel">
  <div class="logo">DELHI BATTLE</div>
  <p>Cartoon Combat · Team Deathmatch</p>
  <p class="small">Choose your team</p>
  <div class="row">
   <button id="bjp" class="active">🟠 BJP</button>
   <button id="cgp">🟢 CGP</button>
  </div>
  <p class="small">Match duration</p>
  <div class="row">
   <button data-time="180">3 min</button>
   <button class="active" data-time="300">5 min</button>
   <button data-time="480">8 min</button>
  </div>
  <button id="start">⚔️ START BATTLE</button>
  <p class="small">Laptop: A/D move · W/Space jump · Mouse aim/fire · F melee · R reload<br>Mobile: Use the on-screen buttons</p>
  <p class="small">Prototype 02 · One player + four bots</p>
 </div>
</div>

<canvas id="game"></canvas>

<div id="hud">
 <div class="hudrow">
  <div class="badge"><span id="teamName">BJP</span> · HP <span id="hpText">100</span><div id="healthOuter"><div id="health"></div></div></div>
  <div class="badge">🟠 BJP <span id="scoreB">0</span> : <span id="scoreC">0</span> 🟢 CGP</div>
  <div class="badge">⏱ <span id="timer">05:00</span><br><span id="weaponText">Desi Katta · 1/6</span></div>
 </div>
</div>

<div id="message"></div>

<div id="controls">
 <button class="pad" id="left">◀</button>
 <button class="pad" id="right">▶</button>
 <button class="pad" id="jump">⬆</button>
 <button class="pad" id="fire">●</button>
 <button class="pad" id="melee">✊</button>
 <button class="pad" id="reload">R</button>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('game');
const ctx=canvas.getContext('2d');

let W=innerWidth,H=innerHeight,DPR=1;
let team='BJP',duration=300,timeLeft=300;
let playing=false,ended=false,last=0,raf=0;
let player,bots=[],bullets=[],particles=[],platforms=[];
let camera=0,score={BJP:0,CGP:0},keys={};
let mouse={x:W*.75,y:H*.5,down:false};
const worldWidth=2600,gravity=1650;
const touch={left:false,right:false,jump:false,melee:false,fire:false};

function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize);resize();

function floorY(){return H-75}
function chooseTeam(t){
 team=t;
 $('bjp').classList.toggle('active',t==='BJP');
 $('cgp').classList.toggle('active',t==='CGP');
}
$('bjp').onclick=()=>chooseTeam('BJP');
$('cgp').onclick=()=>chooseTeam('CGP');

document.querySelectorAll('[data-time]').forEach(btn=>{
 btn.onclick=()=>{
  duration=Number(btn.dataset.time);
  document.querySelectorAll('[data-time]').forEach(b=>b.classList.toggle('active',b===btn));
 };
});

function makePlatforms(){
 platforms=[{x:0,y:floorY(),w:worldWidth,h:75}];
 for(let i=0;i<10;i++){
  platforms.push({x:180+i*245,y:floorY()-110-(i%3)*35,w:145,h:18});
 }
}

function makeFighter(x,t,human=false,i=0){
 return {
  x,y:floorY()-50,vx:0,vy:0,w:34,h:50,team:t,human,
  hp:100,alive:true,ground:false,face:1,ammo:1,reserve:6,
  reload:0,shoot:0,melee:0,respawn:0,invuln:0,aiTimer:0,
  name:human?'YOU':'BOT '+(i+1),
  color:t==='BJP'?'#ff9b3d':'#39d89a',kills:0
 };
}

function startGame(){
 cancelAnimationFrame(raf);
 timeLeft=duration;ended=false;playing=true;
 score={BJP:0,CGP:0};camera=0;
 makePlatforms();
 player=makeFighter(150,team,true);
 bots=[];
 for(let i=0;i<4;i++){
  let botTeam=team==='BJP'?(i<2?'CGP':'BJP'):(i<2?'BJP':'CGP');
  bots.push(makeFighter(450+i*350,botTeam,false,i));
 }
 bullets=[];particles=[];
 mouse.down=false;
 $('menu').style.display='none';
 $('hud').style.display='block';
 $('controls').style.display='block';
 $('message').textContent='FIGHT!';
 setTimeout(()=>{if(playing)$('message').textContent=''},900);
 last=performance.now();
 raf=requestAnimationFrame(loop);
}
$('start').onclick=startGame;

function jump(f){
 if(f.alive&&f.ground){f.vy=-650;f.ground=false}
}

function shoot(f,tx,ty){
 if(!f.alive||f.reload>0||f.shoot>0)return;
 if(f.ammo<=0){f.reload=1.15;return}
 f.ammo--;f.shoot=.3;
 const sx=f.x+f.w/2,sy=f.y+f.h*.43;
 let dx=tx-sx,dy=ty-sy;
 let len=Math.hypot(dx,dy)||1;
 f.face=dx>=0?1:-1;
 bullets.push({
  x:sx,y:sy,vx:dx/len*820,vy:dy/len*820,
  owner:f,team:f.team,life:1.15,damage:38,color:f.color
 });
 if(f.ammo===0)f.reload=1.15;
}

function hurt(target,damage,owner){
 if(!target.alive||target.invuln>0||target.team===owner.team)return;
 target.hp-=damage;
 for(let i=0;i<6;i++){
  particles.push({x:target.x+target.w/2,y:target.y+20,
   vx:(Math.random()-.5)*200,vy:-Math.random()*200,
   life:.35,color:'#ffe28a'});
 }
 if(target.hp<=0){
  target.hp=0;target.alive=false;target.respawn=3;
  score[owner.team]++;owner.kills++;
  $('message').textContent=owner.human?'ELIMINATION!':'';
  setTimeout(()=>{if(playing)$('message').textContent=''},700);
 }
}

function respawn(f){
 f.x=f.human?150:Math.random()*1700+350;
 f.y=floorY()-60;f.hp=100;f.alive=true;f.invuln=1.5;
 f.ammo=1;f.reserve=6;f.reload=0;f.vx=0;f.vy=0;
}

function updateFighter(f,dt){
 if(!f.alive){
  f.respawn-=dt;
  if(f.respawn<=0)respawn(f);
  return;
 }

 f.invuln=Math.max(0,f.invuln-dt);
 f.shoot=Math.max(0,f.shoot-dt);
 f.melee=Math.max(0,f.melee-dt);

 if(f.reload>0){
  f.reload-=dt;
  if(f.reload<=0){f.reload=0;f.ammo=1;f.reserve=Math.max(0,f.reserve-1)}
 }

 let dir=0;

 if(f.human){
  dir=(keys.KeyA||keys.ArrowLeft||touch.left?-1:0)
      +(keys.KeyD||keys.ArrowRight||touch.right?1:0);

  if((keys.Space||keys.KeyW||keys.ArrowUp||touch.jump)&&f.ground)jump(f);

  if((keys.KeyF||touch.melee)&&f.melee<=0){
   f.melee=.55;
   for(const b of bots){
    if(b.alive&&b.team!==f.team&&Math.abs(b.x-f.x)<60&&Math.abs(b.y-f.y)<65)
     hurt(b,25,f);
   }
  }

  if(keys.KeyR&&f.ammo<1&&f.reload<=0)f.reload=1.15;

  if(mouse.down)shoot(f,mouse.x+camera,mouse.y);
  if(touch.fire)shoot(f,mouse.x+camera,mouse.y);

 }else{
  let targets=[player,...bots].filter(t=>t!==f&&t.alive&&t.team!==f.team);
  targets.sort((a,b)=>Math.abs(a.x-f.x)-Math.abs(b.x-f.x));
  let target=targets[0];

  if(target){
   const dx=target.x-f.x,dy=target.y-f.y;
   if(Math.abs(dx)>245)dir=Math.sign(dx);
   else if(Math.abs(dx)<110)dir=-Math.sign(dx)*.4;

   if(Math.abs(dx)<570&&Math.abs(dy)<230){
    f.aiTimer-=dt;
    if(f.aiTimer<=0){
     shoot(f,target.x+target.w/2+(Math.random()-.5)*45,
       target.y+target.h/2+(Math.random()-.5)*35);
     f.aiTimer=.55+Math.random()*.55;
    }
   }
   if(f.ground&&Math.abs(dx)<220&&Math.random()<.02)jump(f);
  }
 }

 f.vx=dir*245;
 if(dir)f.face=Math.sign(dir);
 f.x=Math.max(0,Math.min(worldWidth-f.w,f.x+f.vx*dt));
 const oldBottom=f.y+f.h;
 f.vy+=gravity*dt;
 f.y+=f.vy*dt;
 f.ground=false;

 for(const p of platforms){
  if(f.x+f.w>p.x&&f.x<p.x+p.w&&
     f.y+f.h>=p.y&&oldBottom<=p.y&&f.vy>=0){
   f.y=p.y-f.h;f.vy=0;f.ground=true;
  }
 }
 if(f.y>H+120){
  f.alive=false;f.hp=0;f.respawn=3;
 }
}

function loop(now){
 if(!playing)return;
 const dt=Math.min((now-last)/1000,.03);
 last=now;

 if(!ended){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endMatch();return}

  updateFighter(player,dt);
  bots.forEach(b=>updateFighter(b,dt));

  for(let i=bullets.length-1;i>=0;i--){
   const q=bullets[i];
   q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
   for(const t of [player,...bots]){
    if(t.alive&&t.team!==q.team&&t!==q.owner&&
       q.x>=t.x&&q.x<=t.x+t.w&&q.y>=t.y&&q.y<=t.y+t.h){
     hurt(t,q.damage,q.owner);q.life=0;break;
    }
   }
   if(q.life<=0||q.x<camera-80||q.x>camera+W+80)bullets.splice(i,1);
  }

  for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;
   if(p.life<=0)particles.splice(i,1);
  }

  camera=Math.max(0,Math.min(worldWidth-W,player.x-W*.4));
  draw();updateHud();
 }
 raf=requestAnimationFrame(loop);
}

function endMatch(){
 ended=true;playing=false;
 $('message').textContent=score.BJP===score.CGP?'DRAW!':
  score.BJP>score.CGP?'BJP WINS!':'CGP WINS!';
 $('menu').style.display='flex';
 $('hud').style.display='none';
 $('controls').style.display='none';
 $('start').textContent='PLAY AGAIN';
}

function updateHud(){
 $('hpText').textContent=Math.ceil(player.hp);
 $('health').style.width=Math.max(0,player.hp)+'%';
 $('teamName').textContent=team;
 $('scoreB').textContent=score.BJP;
 $('scoreC').textContent=score.CGP;
 $('timer').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+
  String(Math.floor(timeLeft%60)).padStart(2,'0');
 $('weaponText').textContent='Desi Katta · '+player.ammo+'/1'+
  (player.reload>0?' · RELOADING':'');
}

function drawFighter(f){
 if(!f.alive)return;
 const x=f.x,y=f.y;
 ctx.save();
 if(f.invuln>0&&Math.floor(performance.now()/100)%2)ctx.globalAlpha=.5;

 ctx.fillStyle='#0005';
 ctx.beginPath();ctx.ellipse(x+f.w/2,y+f.h+3,21,6,0,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=f.color;ctx.fillRect(x+5,y+19,24,28);
 ctx.fillStyle='#f0c5a0';
 ctx.beginPath();ctx.arc(x+17,y+12,15,0,Math.PI*2);ctx.fill();

 ctx.fillStyle=f.team==='BJP'?'#f57b28':'#25bc8d';
 ctx.fillRect(x+2,y+3,30,7);

 ctx.fillStyle='#242435';
 ctx.fillRect(x+10,y+11,3,4);ctx.fillRect(x+21,y+11,3,4);
 ctx.strokeStyle='#242435';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(x+17,y+17,5,0,Math.PI);ctx.stroke();

 ctx.fillStyle='#d6d9e5';
 ctx.fillRect(x+(f.face===1?25:-5),y+26,15,6);
 ctx.fillStyle='#f5d365';
 ctx.fillRect(x+4,y+46,10,5);ctx.fillRect(x+21,y+46,10,5);

 ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillStyle='#fff';
 ctx.fillText(f.name,x+f.w/2,y-10);
 ctx.fillStyle='#25263a';ctx.fillRect(x,y-5,f.w,4);
 ctx.fillStyle=f.hp>50?'#54df7d':'#ff514f';
 ctx.fillRect(x,y-5,f.w*Math.max(0,f.hp/100),4);
 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,'#282c50');sky.addColorStop(1,'#ed9865');
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 ctx.save();ctx.translate(-camera,0);

 for(let i=0;i<18;i++){
  const x=i*170,bh=130+(i*47%210);
  ctx.fillStyle=['#38445e','#4b4e66','#64536a'][i%3];
  ctx.fillRect(x,floorY()-bh,115,bh);
  ctx.fillStyle='#ffd77b';
  for(let j=0;j<4;j++)for(let k=0;k<3;k++)
   ctx.fillRect(x+15+j*23,floorY()-bh+18+k*32,10,15);
 }

 ctx.fillStyle='#777985';ctx.fillRect(0,floorY(),worldWidth,75);
 ctx.fillStyle='#f2bd61';
 for(let x=0;x<worldWidth;x+=100)ctx.fillRect(x,floorY()+38,45,5);

 for(const p of platforms){
  if(p.h<50){
   ctx.fillStyle='#35364a';ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.fillStyle='#ffb54b';ctx.fillRect(p.x,p.y,p.w,4);
  }
 }

 [player,...bots].forEach(drawFighter);

 for(const b of bullets){
  ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff4c7';ctx.beginPath();ctx.arc(b.x,b.y,2,0,Math.PI*2);ctx.fill();
 }

 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/.35);
  ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.restore();
}

function bindHold(id,key){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();touch[key]=true;
  try{el.setPointerCapture(e.pointerId)}catch{}
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  el.addEventListener(ev,()=>touch[key]=false));
}
bindHold('left','left');bindHold('right','right');
bindHold('jump','jump');bindHold('melee','melee');bindHold('fire','fire');

$('reload').addEventListener('pointerdown',()=>{
 if(player&&player.ammo<1&&player.reload<=0)player.reload=1.15;
});

canvas.addEventListener('pointermove',e=>{
 const r=canvas.getBoundingClientRect();
 mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
});

canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'){
  const r=canvas.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;
  mouse.down=true;
 }
});
addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false});
addEventListener('blur',()=>{mouse.down=false;Object.keys(keys).forEach(k=>keys[k]=false)});

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);

})();
</script>
</body>
</html>
