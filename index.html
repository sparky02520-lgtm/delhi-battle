<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Delhi Battle — Team Deathmatch</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10121b;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:800;color:#fff;background:#ed702d}
button:active{transform:scale(.97)}
#menu{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#444568,#10121b 70%);padding:20px}
.panel{width:min(480px,100%);text-align:center;background:#171a28;border:1px solid #42465b;border-radius:22px;padding:28px;box-shadow:0 20px 80px #0008}
.logo{font-size:clamp(35px,8vw,62px);font-weight:1000;letter-spacing:-3px;color:#ffb34c;text-shadow:3px 4px 0 #873d26}
.subtitle{color:#bdc3d9;margin-bottom:22px}
.row{display:flex;gap:10px;margin:14px 0}
.row button{flex:1;background:#303449;border:2px solid transparent}
.row button.active{border-color:#ffb34c;background:#48415a}
#start{width:100%;font-size:19px;margin-top:12px}
.note{font-size:12px;color:#9fa7c1;line-height:1.6;margin-top:18px}
#hud{display:none;position:fixed;z-index:2;top:0;left:0;right:0;padding:10px;pointer-events:none}
.hudrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.badge{background:#171a28e8;border:1px solid #454a60;border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px}
#healthOuter{width:150px;height:12px;background:#542f3b;border-radius:8px;overflow:hidden;margin-top:5px}
#health{height:100%;width:100%;background:#50dc7b;transition:width .15s}
#game{display:block;width:100vw;height:100dvh;touch-action:none}
#controls{display:none;position:fixed;inset:0;z-index:3;pointer-events:none}
.pad{position:absolute;bottom:22px;width:64px;height:64px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff65;color:white;font-size:22px;pointer-events:auto;touch-action:none;user-select:none}
#left{left:18px}#right{left:92px}
#jump{right:18px;bottom:100px}#fire{right:18px;bottom:22px;background:#e9554380}
#melee{right:94px;bottom:22px}#switch{right:94px;bottom:100px}
#msg{position:fixed;z-index:4;top:28%;left:0;right:0;text-align:center;font-size:clamp(25px,6vw,46px);font-weight:1000;text-shadow:0 4px 12px #000;pointer-events:none}
@media(min-width:800px){#controls{display:none!important}}
@media(max-width:799px){.pad{width:58px;height:58px;font-size:19px}.badge{font-size:11px;padding:7px}}
</style>
</head>
<body>
<div id="menu">
 <div class="panel">
  <div class="logo">DELHI BATTLE</div>
  <div class="subtitle">Cartoon Combat · Team Deathmatch</div>
  <p>Choose your team</p>
  <div class="row">
   <button id="bjp" class="active" onclick="chooseTeam('BJP')">🟠 BJP</button>
   <button id="cgp" onclick="chooseTeam('CGP')">🟢 CGP</button>
  </div>
  <p>Match duration</p>
  <div class="row">
   <button onclick="chooseTime(180,this)">3 min</button>
   <button class="active" onclick="chooseTime(300,this)">5 min</button>
   <button onclick="chooseTime(480,this)">8 min</button>
  </div>
  <button id="start" onclick="startGame()">⚔️ START BATTLE</button>
  <div class="note">Prototype 01 · One player + four bots<br>Move: A/D · Jump: W or Space · Aim: Mouse · Shoot: Click · Melee: F · Switch weapon: 1/2<br>Mobile: use the on-screen buttons</div>
 </div>
</div>
<div id="hud">
 <div class="hudrow">
  <div class="badge"><span id="teamName">BJP</span><div>HP <span id="hpText">100</span></div><div id="healthOuter"><div id="health"></div></div></div>
  <div class="badge">🟠 BJP <span id="scoreB">0</span> : <span id="scoreC">0</span> 🟢 CGP</div>
  <div class="badge">⏱ <span id="timer">05:00</span><br><span id="weaponText">Desi Katta · 1/6</span></div>
 </div>
</div>
<canvas id="game"></canvas>
<div id="msg"></div>
<div id="controls">
 <button class="pad" id="left">◀</button><button class="pad" id="right">▶</button>
 <button class="pad" id="jump">⬆</button><button class="pad" id="fire">●</button>
 <button class="pad" id="melee">✊</button><button class="pad" id="switch">⇄</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=1,team='BJP',duration=300,timeLeft=300,playing=false,ended=false;
let player,bots=[],bullets=[],particles=[],platforms=[],camera=0,score={BJP:0,CGP:0},keys={},mouse={x:W*.7,y:H*.5,down:false},last=0,raf=0;
const gravity=1700,worldWidth=2600;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function chooseTeam(t){team=t;$('bjp').classList.toggle('active',t==='BJP');$('cgp').classList.toggle('active',t==='CGP')}
function chooseTime(s,btn){duration=s;document.querySelectorAll('.row button').forEach(b=>{if(/min/.test(b.textContent))b.classList.remove('active')});btn.classList.add('active')}
function floorY(){return H-80}
function makePlatforms(){platforms=[{x:0,y:floorY(),w:worldWidth,h:80}];for(let i=0;i<10;i++){let x=200+i*245;platforms.push({x,y:floorY()-110-(i%3)*35,w:130+(i%2)*45,h:18})}}
function makeFighter(x,t,human=false,i=0){return {x,y:floorY()-50,vx:0,vy:0,w:34,h:50,team:t,human,hp:100,alive:true,ground:false,face:1,ammo:1,reserve:6,reload:0,shoot:0,melee:0,respawn:0,invuln:0,aiTimer:0,name:human?'YOU':'BOT '+(i+1),color:t==='BJP'?'#ff9b3d':'#39d89a',kills:0,weapon:0}}
function startGame(){cancelAnimationFrame(raf);team=team;timeLeft=duration;ended=false;playing=true;score={BJP:0,CGP:0};camera=0;makePlatforms();player=makeFighter(150,team,true);bots=[];let enemies=0;for(let i=0;i<4;i++){let t;if(team==='BJP')t=i<2?'CGP':'BJP';else t=i<2?'BJP':'CGP';bots.push(makeFighter(450+i*350,t,false,i))}bullets=[];particles=[];$('menu').style.display='none';$('hud').style.display='block';$('controls').style.display='block';$('msg').textContent='FIGHT!';setTimeout(()=>{if(playing)$('msg').textContent=''},1000);last=performance.now();raf=requestAnimationFrame(loop)}
function shoot(f,tx,ty){if(!f.alive||f.reload>0||f.shoot>0)return;if(f.ammo<=0){f.reload=1.1;return}f.ammo--;f.shoot=.32;let sx=f.x+f.w/2,sy=f.y+f.h*.43,dx=tx-sx,dy=ty-sy,len=Math.hypot(dx,dy)||1;f.face=dx>=0?1:-1;bullets.push({x:sx,y:sy,vx:dx/len*780,vy:dy/len*780,owner:f,team:f.team,life:1.2,damage:38,color:f.color});if(f.ammo===0)f.reload=1.1}
function jump(f){if(f.alive&&f.ground){f.vy=-650;f.ground=false}}
function hurt(target,damage,owner){if(!target.alive||target.invuln>0||target.team===owner.team)return;target.hp-=damage;for(let i=0;i<7;i++)particles.push({x:target.x+target.w/2,y:target.y+20,vx:(Math.random()-.5)*220,vy:-Math.random()*220,life:.35,color:'#ffe28a'});if(target.hp<=0){target.hp=0;target.alive=false;target.respawn=3;score[owner.team]++;owner.kills++;if(owner.human)$('msg').textContent='ELIMINATION!';setTimeout(()=>{if(playing)$('msg').textContent=''},850)}}
function respawn(f){f.x=f.human?150:Math.random()*1700+350;f.y=floorY()-60;f.hp=100;f.alive=true;f.invuln=1.4;f.ammo=1;f.reserve=6;f.reload=0;f.vx=0;f.vy=0}
function updateFighter(f,dt){if(!f.alive){f.respawn-=dt;if(f.respawn<=0)respawn(f);return}f.invuln=Math.max(0,f.invuln-dt);f.shoot=Math.max(0,f.shoot-dt);f.melee=Math.max(0,f.melee-dt);if(f.reload>0){f.reload-=dt;if(f.reload<=0){f.ammo=1;f.reserve=Math.max(0,f.reserve-1)}}let dir=0;if(f.human){dir=(keys.ArrowLeft||keys.KeyA||touch.left?-1:0)+(keys.ArrowRight||keys.KeyD||touch.right?1:0);if((keys.Space||keys.KeyW||keys.ArrowUp||touch.jump)&&f.ground)jump(f);if((keys.KeyF||touch.melee)&&f.melee<=0){f.melee=.55;for(const b of bots)if(b.alive&&b.team!==f.team&&Math.abs((b.x+b.w/2)-(f.x+f.w/2))<60&&Math.abs(b.y-f.y)<65)hurt(b,25,f)}if(keys.Digit1)f.weapon=0;if(keys.Digit2)f.weapon=1;if(mouse.down)shoot(f,mouse.x+camera,mouse.y)}else{let target=player;if(!player.alive||player.team===f.team){target=bots.filter(b=>b.alive&&b.team!==f.team).sort((a,b)=>Math.abs(a.x-f.x)-Math.abs(b.x-f.x))[0]||player}if(target&&target.alive){let dx=(target.x+target.w/2)-(f.x+f.w/2),dy=(target.y+target.h/2)-(f.y+f.h/2);if(Math.abs(dx)>250)dir=Math.sign(dx);else if(Math.abs(dx)<125)dir=-Math.sign(dx)*.5;if(Math.abs(dx)<560&&Math.abs(dy)<230){f.aiTimer-=dt;if(f.aiTimer<=0){shoot(f,target.x+target.w/2+(Math.random()-.5)*65,target.y+target.h/2+(Math.random()-.5)*45);f.aiTimer=.5+Math.random()*.5}}if(f.ground&&Math.abs(dx)<220&&Math.random()<.018)jump(f)}}f.vx=dir*250;if(dir)f.face=Math.sign(dir);f.x+=f.vx*dt;f.x=Math.max(0,Math.min(worldWidth-f.w,f.x));f.vy+=gravity*dt;f.y+=f.vy*dt;f.ground=false;for(const p of platforms){if(f.x+f.w>p.x&&f.x<p.x+p.w&&f.y+f.h>=p.y&&f.y+f.h-f.vy*dt<=p.y&&f.vy>=0){f.y=p.y-f.h;f.vy=0;f.ground=true}}if(f.y>H+100){f.hp=0;f.alive=false;f.respawn=3}}
function loop(now){if(!playing)return;let dt=Math.min((now-last)/1000,.035);last=now;if(!ended){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;endMatch()}updateFighter(player,dt);bots.forEach(b=>updateFighter(b,dt));for(let i=bullets.length-1;i>=0;i--){let q=bullets[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let targets=[player,...bots];for(const t of targets){if(t.alive&&t.team!==q.team&&t!==q.owner&&q.x>t.x&&q.x<t.x+t.w&&q.y>t.y&&q.y<t.y+t.h){hurt(t,q.damage,q.owner);q.life=0;break}}if(q.life<=0||q.x<camera-50||q.x>camera+W+50)bullets.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}camera=Math.max(0,Math.min(worldWidth-W,player.x-W*.4));if(player.hp<=0&&player.alive)player.hp=0;draw();updateHud()}raf=requestAnimationFrame(loop)}
function endMatch(){ended=true;playing=false;$('msg').textContent=score.BJP===score.CGP?'DRAW!':score.BJP>score.CGP?'BJP WINS!':'CGP WINS!';$('menu').style.display='flex';$('hud').style.display='none';$('controls').style.display='none';$('start').textContent='PLAY AGAIN';$('start').onclick=()=>{ $('start').onclick=startGame;$('start').textContent='⚔️ START BATTLE';startGame()};}
function updateHud(){$('hpText').textContent=Math.ceil(player.hp);$('health').style.width=Math.max(0,player.hp)+'%';$('teamName').textContent=team;$('scoreB').textContent=score.BJP;$('scoreC').textContent=score.CGP;$('timer').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(Math.floor(timeLeft%60)).padStart(2,'0');$('weaponText').textContent='Desi Katta · '+player.ammo+'/1'+(player.reload>0?' · RELOADING':'')}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#282c50');sky.addColorStop(1,'#ed9865');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camera,0);for(let i=0;i<18;i++){let x=i*170;ctx.fillStyle=['#38445e','#4b4e66','#64536a'][i%3];let bh=130+(i*47%210);ctx.fillRect(x,floorY()-bh,115,bh);ctx.fillStyle='#ffd77b';for(let j=0;j<4;j++)for(let k=0;k<3;k++)ctx.fillRect(x+15+j*23,floorY()-bh+18+k*32,10,15)}ctx.fillStyle='#777985';ctx.fillRect(0,floorY(),worldWidth,80);ctx.fillStyle='#f2bd61';for(let x=0;x<worldWidth;x+=100)ctx.fillRect(x,floorY()+38,45,5);for(const p of platforms){if(p.h<50){ctx.fillStyle='#35364a';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#ffb54b';ctx.fillRect(p.x,p.y,p.w,4)}}for(const f of [player,...bots])drawFighter(f);for(const b of bullets){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff4c7';ctx.beginPath();ctx.arc(b.x,b.y,2,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.restore()}
function drawFighter(f){if(!f.alive)return;let x=f.x,y=f.y;ctx.save();if(f.invuln>0&&Math.floor(performance.now()/100)%2)ctx.globalAlpha=.5;ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x+f.w/2,f.y+f.h+3,22,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.color;ctx.fillRect(x+5,y+19,24,28);ctx.fillStyle='#f0c5a0';ctx.beginPath();ctx.arc(x+17,y+12,15,0,Math.PI*2);ctx.fill();ctx.fillStyle=f.team==='BJP'?'#f57b28':'#25bc8d';ctx.fillRect(x+2,y+3,30,7);ctx.fillStyle='#222';ctx.fillRect(x+10,y+11,3,4);ctx.fillRect(x+21,y+11,3,4);ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+17,y+17,5,0,Math.PI);ctx.stroke();ctx.fillStyle='#d6d9e5';ctx.fillRect(x+(f.face===1?25:-5),y+26,15,6);ctx.fillStyle='#f5d365';ctx.fillRect(x+4,y+46,10,5);ctx.fillRect(x+21,y+46,10,5);ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(f.name,x+f.w/2,y-9);ctx.fillStyle='#333';ctx.fillRect(x-1,y-5,f.w+2,4);ctx.fillStyle=f.hp>50?'#54df7d':'#ff514f';ctx.fillRect(x,y-4,(f.w)*Math.max(0,f.hp/100),2);ctx.restore()}
const touch={left:false,right:false,jump:false,melee:false};
function bindHold(id,key){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();touch[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,e=>{touch[key]=false}))}
bindHold('left','left');bindHold('right','right');bindHold('jump','jump');bindHold('melee','melee');$('fire').addEventListener('pointerdown',e=>{e.preventDefault();mouse.down=true;let r=canvas.getBoundingClientRect();mouse.x=r.width*.7;mouse.y=r.height*.5});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('fire').addEventListener(ev,()=>mouse.down=false));$('switch').addEventListener('pointerdown',()=>{if(player){player.weapon=1-player.weapon;player.ammo=1}});
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY}});addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouse.down=false});
addEventListener('keydown',e=>{if(e.code==='KeyF')keys.KeyF=true});addEventListener('keyup',e=>{if(e.code==='KeyF')keys.KeyF=false});
window.startGame = startGame;
window.chooseTeam = chooseTeam;
window.chooseTime = chooseTime;
})();
</script>
</body>
</html>
